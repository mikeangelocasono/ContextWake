name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs; the trailing comment names the tag the SHA
# was resolved from, so Dependabot can track every pin (see docs/release.md).
# dtolnay/rust-toolchain@v1 needs the explicit toolchain input.
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Avoid restoring stale cargo-package target entries across releases.
          # Registry and Git dependency caches remain enabled.
          cache-targets: false
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --all-targets --all-features
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-targets --all-features
      - run: cargo build --locked --workspace --release
      - name: Smoke-test canonical and compatibility binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\target\release\ctx.exe --version
          .\target\release\ctx.exe --help
          .\target\release\ctxwake.exe --version
      - name: Check Windows binaries need no Visual C++ runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-windows-runtime.ps1 -Path target/release/ctx.exe, target/release/ctxwake.exe
      - name: Smoke-test canonical and compatibility binaries (Unix)
        if: runner.os != 'Windows'
        run: |
          ./target/release/ctx --version
          ./target/release/ctx --help
          ./target/release/ctxwake --version
      - name: Check macOS PATH collision
        if: runner.os == 'macOS'
        run: |
          if command -v ctx >/dev/null 2>&1; then
            echo "ctx already exists on the runner PATH; smoke tests use the explicit build path"
            command -v ctx
          else
            echo "ctx is not present on the runner PATH"
          fi
      - if: runner.os == 'Linux'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/contextwake-package
        run: cargo package --locked

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_VERSION: 8.30.1

  docs-links:
    name: docs-links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --verbose './**/*.md' './**/*.yml'
          fail: true
          jobSummary: true
