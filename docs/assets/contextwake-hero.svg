<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
  <title id="title">ContextWake</title>
  <desc id="description">One workspace. Any coding agent. Keep your context.</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="30" x2="1120" y2="490" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1220"/>
      <stop offset="0.52" stop-color="#101827"/>
      <stop offset="1" stop-color="#07111d"/>
    </linearGradient>
    <linearGradient id="wake" x1="266" y1="359" x2="979" y2="177" gradientUnits="userSpaceOnUse">
