    <text x="81" y="258" fill="#cbd5e1" font-size="25">One workspace. Any coding agent.</text>
    <text x="81" y="293" fill="#67e8f9" font-size="25" font-weight="650">Keep your context.</text>

    <text x="81" y="354" fill="#7f8ea3" font-size="16">workspaces  /  sessions  /  checkpoints  /  handoffs</text>
