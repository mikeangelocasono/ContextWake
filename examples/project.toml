# Copy to <workspace>/.contextwake/project.toml and review before trusting.
schema_version = 1
name = "Example Workspace"
preferred_agent = "codex"
preferred_model_provider = "openai"
preferred_profile = "work"
instructions_file = "AGENTS.md"

[[validation]]
executable = "cargo"
args = ["fmt", "--all", "--", "--check"]

[[validation]]
executable = "cargo"
args = ["test", "--locked", "--all-targets", "--all-features"]
